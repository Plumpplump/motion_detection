[project]
name = "motion-detector"
version = "0.1.0"
description = "Motion-triggered object recognition with a local ONNX model and optional AI backends."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=0.86.5",
    "flet-camera>=0.86.5",
    "httpx>=0.28.1",
    "onnxruntime>=1.23.2",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.mycompany"
product = "motion-detector"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
